services:
  - type: web
    name: sort-image-by-face
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Set this yourself in the Render dashboard: it is the passphrase.
      - key: APP_SECRET
        sync: false
      # Render generates this once; changing it signs everyone out.
      - key: COOKIE_KEY
        generateValue: true
      # The machine-facing API stays disabled until this is set.
      - key: API_KEY
        sync: false
      # Comma-separated hosts the API may download images from. Leave unset to
      # allow any public host; private and link-local addresses are always
      # refused either way.
      - key: ALLOWED_IMAGE_HOSTS
        sync: false
