<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sort by Face</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Sort by Face</h1>
      <p class="lede">
        Pick a folder of photos and they are grouped by who appears in them.
        Everything runs in this browser — no photo is uploaded anywhere.
      </p>

      <div class="toolbar">
        <button id="pick" type="button">Choose a folder</button>
        <span id="status">Ready when you are.</span>
      </div>

      <input id="picker" type="file" webkitdirectory multiple accept="image/*" hidden />

      <div id="progress" hidden><div id="bar"></div></div>
      <p id="summary"></p>
      <div id="results"></div>
    </main>

    <script src="/vendor/jszip.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
